<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo misanma</title>

    <!-- CONFIGURACIÓN DE ICONOS PARA MÓVILES Y PC -->

 <link rel="icon" type="image/png" href="./logobombo.png?v=1" sizes="32x32">
    <link rel="icon" type="image/png" href="./logobombo.png?v=1" sizes="192x192">

<!-- Para iPhone (Cámbialo obligatoriamente a tu nuevo PNG) -->
 
 <link rel="apple-touch-icon" href="./logobombo.png?v=1">
    <link rel="apple-touch-icon" sizes="152x152" href="./logobombo.png?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="./logobombo.png?v=1">
    <link rel="apple-touch-icon" sizes="167x167" href="./logobombo.png?v=1">

        <!-- Enlace obligatorio para activar el manifest en Android y Windows -->
    <link rel="manifest" href="manifest.json">

    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bombo Misanma">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- ESTILOS DE LA CABECERA RESALTADA --- */
        .frase-cabecera {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .frase-cabecera .subtitulo {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #5d6d7e;
            font-weight: 800;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.05);
        }

        .frase-cabecera .marca {
            font-size: 56px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 5px 0;
            background: linear-gradient(135deg, #0b3c5d 0%, #328cc1 50%, #0b3c5d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 4px 6px rgba(11, 60, 93, 0.25));
        }

        .frase-cabecera .eslogan {
            font-size: 22px;
            font-style: italic;
            font-weight: 800;
            color: #d9b310;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            padding: 0 15px;
            text-shadow: 1px 2px 4px rgba(217, 179, 16, 0.3);
        }

        .frase-cabecera .eslogan::before,
        .frase-cabecera .eslogan::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 25px;
            height: 3px;
            background-color: #d9b310;
            box-shadow: 0 1px 3px rgba(217, 179, 16, 0.4);
        }

        .frase-cabecera .eslogan::before { left: -25px; }
        .frase-cabecera .eslogan::after { right: -25px; }

        /* --- DISEÑO REALISTA DEL BOMBO DE ORO ESPAÑOL --- */
        .escena-bombo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
            height: 180px;
            position: relative;
        }

        .soporte-bombo {
            width: 170px;
            height: 150px;
            border: 6px solid #d4af37;
            border-bottom: none;
            border-radius: 35px 35px 0 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.05), transparent);
        }

        .soporte-bombo::before {
            content: '';
            position: absolute;
            bottom: -6px;
            width: 210px;
            height: 12px;
            background: linear-gradient(to bottom, #d4af37, #aa841c);
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .soporte-bombo::after {
            content: '';
            position: absolute;
            width: 130px;
            height: 6px;
            background-color: #b89222;
            z-index: 1;
        }

        .manivela {
            position: absolute;
            right: -25px;
            top: 50%;
            width: 30px;
            height: 8px;
            background-color: #d4af37;
            transform: translateY(-50%);
            border-radius: 4px;
            z-index: 2;
        }

        .manivela::after {
            content: '';
            position: absolute;
            right: 0;
            top: -15px;
            width: 8px;
            height: 35px;
            background-color: #8a6810;
            border-radius: 4px;
        }

        .esfera-bombo {
            width: 120px;
            height: 120px;
            border: 4px solid #f1d477;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.6), rgba(212, 175, 55, 0.1) 60%, rgba(170, 132, 28, 0.25));
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.3), 0 10px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            align-content: center;
            justify-content: center;
            gap: 3px;
            box-sizing: border-box;
            z-index: 3;
        }

        .girando {
            animation: rotarBomboReal 0.6s infinite linear;
        }

        @keyframes rotarBomboReal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bola-bombo {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #328cc1);
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .bola-bombo:nth-child(3n) { background: radial-gradient(circle at 30% 30%, #fff, #d9b310); }
        .bola-bombo:nth-child(7n) { background: radial-gradient(circle at 30% 30%, #fff, #ba9428); }

        /* --- BOTONES Y RESULTADOS --- */
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #328cc1;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, opacity 0.3s;
        }

        button:nth-child(5) {
            grid-column: span 2;
        }

        button:hover {
            background-color: #0b3c5d;
        }

        button:disabled {
            background-color: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        button.boton-activo {
            background-color: #0b3c5d !important;
            color: white !important;
            opacity: 1 !important;
            box-shadow: 0 0 12px rgba(11, 60, 93, 0.5);
        }

        .boleto {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding: 15px;
            border: 2px dashed #328cc1;
            border-radius: 10px;
            background-color: #f9fbfd;
        }

        .bola {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #328cc1;
            color: white;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }

        .estrella {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            width: 46px;
            height: 46px;
            background-color: #d9b310;
            color: #0b3c5d;
            -webkit-clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            padding-top: 4px;
            box-sizing: border-box;
        }

        .mensaje-suerte {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            font-style: italic;
            animation: aparecerSuave 0.5s ease-out;
        }

        @keyframes aparecerSuave {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cuando el bombo tenga la clase .girando, aplicamos la animación también a la manivela */
.girando ~ .manivela::after {
    animation: rotarManivela 0.6s infinite linear;
    transform-origin: top center; /* Hace que gire desde su punto de unión */
}

@keyframes rotarManivela {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

    </style>
</head>

<body>

    <div class="container">
        <!-- Cabecera -->
        <div class="frase-cabecera">
            <span class="subtitulo">Bombo de lotería</span>
            <h1 class="marca">misanma</h1>
            <span class="eslogan">¡sempre toca!</span>
        </div>

        <!-- Bombo de Oro Español -->
        <div class="escena-bombo">
            <div class="soporte-bombo">
                <div id="bomboEsfera" class="esfera-bombo">
                    <script>
                        for(let i = 0; i < 42; i++) {
                            document.write('<div class="bola-bombo"></div>');
                        }
                    </script>
                </div>
                <div class="manivela"></div>
            </div>
        </div>
        <!-- Panel de Botones Interactivos -->
        <div class="grid-botones">
            <button id="btn-primitiva" onclick="generarPrimitiva()">La Primitiva</button>
            <button id="btn-bonoloto" onclick="generarBonoloto()">Bonoloto</button>
            <button id="btn-gordo" onclick="generarElGordo()">El Gordo</button>
            <button id="btn-euromillones" onclick="generarEuromillones()">Euromillones</button>
            <button id="btn-eurodreams" onclick="generarEuroDreams()">EuroDreams</button>
        </div>

        <!-- Contenedor donde se dibuja el boleto -->
        <div id="resultado"></div>
    </div>

    <!-- Vinculación con la lógica de los sorteos -->
    <script src="app.js"></script>
</body>

</html>
